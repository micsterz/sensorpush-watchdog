name: SensorPush Watchdog

on:
  workflow_dispatch:
    inputs:
      delivery_test:
        description: 'Send the clearly labelled Product Store delivery test only'
        required: false
        type: boolean
        default: false

jobs:
  check-temp:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install dependencies
        run: pip install requests
      - name: Run Script
        env:
          SENSORPUSH_EMAIL: ${{ secrets.SENSORPUSH_EMAIL }}
          SENSORPUSH_PASSWORD: ${{ secrets.SENSORPUSH_PASSWORD }}
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
          PRODUCT_STORE_DELIVERY_TEST: ${{ inputs.delivery_test }}
          JABLOTRON_SESSION: ${{ secrets.JABLOTRON_SESSION }}
          SLACK_BOT_TOKEN: ${{ secrets.SLACK_BOT_TOKEN }}
        run: python main.py
