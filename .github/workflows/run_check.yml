name: SensorPush Watchdog
on:
  schedule:
    - cron: '*/15 * * * *'
  workflow_dispatch:

# This tells GitHub to use Node 24 for all steps in this file
env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4 # You can stay on v4 or v5 now

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run Script
        env:
          SENSORPUSH_EMAIL: ${{ secrets.SENSORPUSH_EMAIL }}
          SENSORPUSH_PASSWORD: ${{ secrets.SENSORPUSH_PASSWORD }}
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
        run: python main.py
