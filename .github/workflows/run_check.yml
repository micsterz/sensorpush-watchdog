

name: SensorPush Watchdog

# Scheduled workflow for SensorPush monitoring
on:
  workflow_dispatch:
  schedule:
    - cron: '*/20 * * * *'
jobs:
  check-temp:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install dependencies
        run: pip install requests
      - name: Run Script
        env:
          SENSORPUSH_EMAIL: ${{ secrets.SENSORPUSH_EMAIL }}
          SENSORPUSH_PASSWORD: ${{ secrets.SENSORPUSH_PASSWORD }}
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
        run: python main.py
